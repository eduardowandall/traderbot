[project]
name = "trader"
version = "0.1.0"
description = "Solana trading bot (Jupiter DEX)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.31.0",
    "tenacity>=9.0.0",
    "typer>=0.16.0",
    "rich>=13.5.2",
    "pandas>=2.1.0",
    "websockets>=15.0.1",
    "solana>=0.40.1",
    "httpx>=0.28.1",
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pyright>=1.1.403",
    "ruff>=0.14.6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# a suíte live (tests/live/) fala com a Jupiter de verdade: só roda com
# `uv run pytest -m live` (o -m da linha de comando vence o daqui)
addopts = "-v --tb=short -m 'not live'"
markers = ["live: hits the real Jupiter endpoints (paper/read-only, no key)"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "C90", # mcage complexity check
]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["trader"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.pyright]
include = ["trader/*"]
typeCheckingMode = "basic"
